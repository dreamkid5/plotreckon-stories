name: Render story videos

on:
  push:
    branches: [main]
    paths:
      - "content/*.txt"
      - "worker/**"
      - ".github/workflows/daily-videos.yml"
  workflow_dispatch:
  # Automatic daily runs. Each run renders one queued script from content/*.txt
  # (a single video takes ~3-4.5h and a GitHub job is capped at 6h, so it is one
  # per run) and leaves the rest for the next run. Four runs a day, spaced 6h
  # apart so they never overlap, drain a queue of 3+ scripts every day. Times are
  # UTC and offset from the hour, which GitHub schedules more reliably.
  schedule:
    - cron: "15 3,9,15,21 * * *"

permissions:
  contents: write

concurrency:
  group: plotreckon-story-videos
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install narration and thumbnail tools
        run: python3 -m pip install --quiet edge-tts pillow

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version

      - name: Verify the 5.5-second production lock
        run: npm test

      - name: Render with locked Ava voice and female presenter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          CF_IMAGE_TOKEN: ${{ secrets.CF_IMAGE_TOKEN }}
          CF_YT_PRIVACY: ${{ vars.CF_YT_PRIVACY || 'private' }}
          CF_INPUT: content
          CF_OUTPUT: output
          CF_STYLE: story
          CF_SCENE_SECONDS: "5.5"
          CF_SEO: "0"
          CF_THUMBNAILS: "1"
          # Stop STARTING a new video after 80 min. A single video can take up to
          # ~4.5h and the job is killed at 6h, so a video started later than this
          # might not finish; better to leave it for the next scheduled run than
          # waste hours on a render that gets killed. The first video always starts
          # at 0 min, so every run still completes at least one.
          CF_TIME_BUDGET_MIN: "80"
        run: node worker/watch.mjs --once

      - name: Archive successfully processed scripts
        if: always()
        run: |
          if [ -n "$(git status --porcelain content)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add content
            git commit -m "Archive processed story scripts [skip ci]" || true
            git pull --rebase --autostash origin main
            git push origin main
          fi

      - name: Save finished videos and thumbnails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plotreckon-videos
          path: |
            output/*.mp4
            output/*-thumbnail.jpg
            output/*.txt
          if-no-files-found: ignore
