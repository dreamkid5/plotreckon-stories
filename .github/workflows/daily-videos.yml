name: Render story videos

on:
  push:
    branches: [main]
    paths:
      - "content/*.txt"
      - "worker/**"
      - ".github/workflows/daily-videos.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: plotreckon-story-videos
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install narration and thumbnail tools
        run: python3 -m pip install --quiet edge-tts pillow

      - name: Install ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffmpeg -version

      - name: Verify the 5.5-second production lock
        run: npm test

      - name: Render with locked Ava voice and female presenter
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          CF_IMAGE_TOKEN: ${{ secrets.CF_IMAGE_TOKEN }}
          CF_YT_PRIVACY: ${{ vars.CF_YT_PRIVACY || 'private' }}
          CF_INPUT: content
          CF_OUTPUT: output
          CF_STYLE: story
          CF_SCENE_SECONDS: "5.5"
          CF_SEO: "0"
          CF_THUMBNAILS: "1"
          CF_TIME_BUDGET_MIN: "330"
        run: node worker/watch.mjs --once

      - name: Archive successfully processed scripts
        if: always()
        run: |
          if [ -n "$(git status --porcelain content)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add content
            git commit -m "Archive processed story scripts [skip ci]" || true
            git pull --rebase --autostash origin main
            git push origin main
          fi

      - name: Save finished videos and thumbnails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plotreckon-videos
          path: |
            output/*.mp4
            output/*-thumbnail.jpg
            output/*.txt
          if-no-files-found: ignore
